[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
strip = true
